[program:promo-oms-worker]
process_name=%(program_name)s_%(process_num)02d
command=php __APP_DIR__/artisan queue:work redis --queue=sync,default --sleep=3 --tries=1 --timeout=3600 --max-time=3600
directory=__APP_DIR__
user=www-data
numprocs=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=3700
redirect_stderr=true
stdout_logfile=__APP_DIR__/storage/logs/worker.log
